name: Local MLOps CI/CD Pipeline

on:
  push:
    branches:
      - '**'  # 모든 브랜치의 push에 대해 실행
  pull_request:
    branches:
      - '**'

jobs:
  docker-build-push:
    runs-on: self-hosted  # 사용자의 로컬 윈도우 컴퓨터에서 작동
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. 로컬 도커 데몬을 사용하여 명시적으로 이미지 빌드 및 Docker Hub 업로드
      - name: Build Docker Image
        shell: bash
        run: |
          echo "Building image for: ${{ secrets.DOCKERHUB_USERNAME }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:latest .
          
      - name: Push Docker Image
        shell: bash
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:latest

      # 3. 로컬 컴퓨터(본인 PC)에 서버 컨테이너 자동 실행 
      - name: Deploy Local API Server
        run: |
          # 기존 컨테이너가 있으면 내리고, 새 이미지로 다시 올림
          docker-compose down
          docker-compose up -d --build
