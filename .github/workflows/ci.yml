name: Local MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: self-hosted  # 사용자의 로컬 윈도우 컴퓨터에서 작동
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Docker Hub 로그인 (PR이 아닐 때만)
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      # 2. 로컬 도커 데몬을 사용하여 명시적으로 이미지 빌드 및 Docker Hub 업로드
      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:latest

      # 3. 로컬 컴퓨터(본인 PC)에 서버 컨테이너 자동 실행 
      - name: Deploy Local API Server
        if: github.event_name != 'pull_request'
        run: |
          # 기존 컨테이너가 있으면 내리고, 새 이미지로 다시 올림
          docker-compose down
          docker-compose up -d --build
