name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # main 브랜치에 푸시되는 경우 동작
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        # PR인 경우 빌드만 테스트하고 Push는 건너뜁니다
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # PR이면 빌드 결과만 확인 (Push 안 함) / 일반 푸시이면 Push 진행
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:${{ github.sha }}
          # Docker 빌드 레이어 캐싱 활성화 (빌드 속도 향상)
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier-api:buildcache,mode=max
